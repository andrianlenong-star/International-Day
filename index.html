    <meta property="og:description" content="Interactive 6-scene audiovisual encyclopedia documentary application for world nations with synchronized Wikipedia factual data and cultural music." />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <script>
      (function() {
        const NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        window.WebSocket = function(url, protocols) {
          const isViteHmr =
            protocols === 'vite-hmr' ||
            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
            (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite')));

          if (isViteHmr) {
            // Mock Vite HMR WebSocket in Cloud Run iframe sandbox
            const listeners = {};
            const mock = {
              url: String(url),
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              send: function() {},
              close: function() {
                mock.readyState = 3;
              },
              addEventListener: function(type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
              },
              dispatchEvent: function(event) {
                const fns = listeners[event.type] || [];
                for (let i = 0; i < fns.length; i++) {
                  try { fns[i](event); } catch (e) {}
                }
              }
            };

            setTimeout(function() {
              mock.dispatchEvent(new Event('open'));
              mock.dispatchEvent(new MessageEvent('message', {
                data: JSON.stringify({ type: 'connected' })
              }));
            }, 30);

            return mock;
          }

          return new NativeWebSocket(url, protocols);
        };

        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).includes('WebSocket closed without opened')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
