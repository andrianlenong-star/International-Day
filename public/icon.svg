  <path d="M 370 196 L 390 240 L 382 270" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round" />
  <circle cx="382" cy="275" r="8" fill="#fbbf24" />
  
  <!-- Play Symbol Accent -->
  <polygon points="236,200 290,230 236,260" fill="#ffffff" />
  
  <!-- Typography / Ribbon -->
  <rect x="96" y="360" width="320" height="64" rx="20" fill="url(#accent)" />
  <text x="256" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0c0a09" text-anchor="middle" letter-spacing="2">EDUZONE</text>
