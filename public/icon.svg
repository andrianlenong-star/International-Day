  <ellipse cx="256" cy="240" rx="60" ry="140" fill="none" stroke="url(#blueGlow)" stroke-width="6" opacity="0.3" />
  <line x1="116" y1="240" x2="396" y2="240" stroke="url(#blueGlow)" stroke-width="6" opacity="0.3" />
  
  <!-- Central Badge Icon -->
  <!-- Graduation Cap -->
  <path d="M 256 140 L 370 196 L 256 252 L 142 196 Z" fill="url(#accent)" />
  <path d="M 180 220 L 180 270 Q 256 320 332 270 L 332 220 L 256 260 Z" fill="#d97706" />
