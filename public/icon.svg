  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.6" />
  
  <!-- Outer Globe Ring -->
